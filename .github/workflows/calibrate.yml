name: calibrate

# Step 1: run the Linux face and scene checks on frames of one VOD. Text output only.

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: VOD URL (Kick)
        required: true
      times:
        description: Seconds into the VOD, space separated
        required: true

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-linux.txt
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r tools/requirements-linux.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            models
          key: vision-models-yunet2023mar-vitb32-laion2b
      - name: Face model
        run: |
          mkdir -p models && f=face_detection_yunet_2023mar.onnx
          [ -s "models/$f" ] || curl -sSfL -o "models/$f" "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/$f"
      - name: Calibrate
        env:
          VOD_URL: ${{ inputs.vod_url }}
          TIMES: ${{ inputs.times }}
        run: python scripts/calibrate.py "$VOD_URL" "$TIMES"
