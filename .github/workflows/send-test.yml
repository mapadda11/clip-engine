name: send-test

# Sends one finished clip from a private alfred-hq release to his Telegram, the same way batches will.
# Nothing is posted anywhere; the clip only goes to his own chat.

on:
  workflow_dispatch:
    inputs:
      release:
        description: alfred-hq release tag
        default: sample-2026-11-22
      clip:
        description: File name in that release (several, comma separated; each .mp4's .txt is its caption)
        default: 1-wrong-place.mp4
      note:
        description: Short note shown on each clip
        default: test clip

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg (sizes and streaming prep)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Get the clips
        env:
          GH_TOKEN: ${{ secrets.ALFRED_HQ_TOKEN }}
          TAG: ${{ inputs.release }}
          CLIPS: ${{ inputs.clip }}
        run: |
          mkdir -p clip
          for c in ${CLIPS//,/ }; do
            gh release download "$TAG" -R mapadda11/alfred-hq -p "$c" -D clip
            gh release download "$TAG" -R mapadda11/alfred-hq -p "${c%.mp4}.txt" -D clip || true
          done
          ls clip
      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTE: ${{ inputs.note }}
        run: python3 bin/send_clips.py clip "$NOTE"
