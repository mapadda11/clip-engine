name: glue-run

# Step 2: the full clipper (private glue in alfred-hq + gaming-clip + the Linux picture tools) on one VOD,
# as a --test run: never posted, never logged. Clips are kept for one day as an artifact, then deleted.
# The run's own log goes into the artifact, not the public Actions log.

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: VOD URL (Kick or Twitch)
        required: true
      campaign:
        description: Campaign settings name (alfred-hq clips/campaigns/settings), for captions, hooks and logo
        default: ""
      max:
        description: Clips to make
        default: "10"
      model:
        description: Speech model for the clip windows (base.en or small.en)
        default: small.en
      send:
        description: Send the clips to his Telegram (yes or no)
        default: "no"
      send_top:
        description: Send only the best N (0 = all)
        default: "0"
      real:
        description: Post-ready clips for a joined campaign (yes) or practice --test clips (no)
        default: "no"
      grade:
        description: Grading mode, also send the rejects labelled REJECTED (yes or no)
        default: "no"
      span:
        description: Hours of a long VOD to clip, e.g. 10-14 (empty = all; strong-crowd VODs never need it)
        default: ""
      options:
        description: "Task 17 extras, space separated: community, ref:BRANCH (alfred-hq), release:TAG (alfred-hq backup), bar:N (rule score to send), format:F1|F2|F5|F7 (task 23 preset)"
        default: ""
  push:  # task 17: a PC without gh starts a run by pushing requests/glue.env (key=value lines, same names)
    branches: [main]
    paths: [requests/glue.env]

permissions:
  contents: read

concurrency:
  group: glue-run-${{ inputs.vod_url }}  # task 17: one run per VOD at a time; different VODs run side by side

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 24 Nov: public repo minutes are free; GitHub's own job limit is 360
    env:
      GC_COMMIT: 005204201f7ad4e5a48f500830c1cd3db2217bf0
      WHISPER_TAG: v1.9.5
    steps:
      - uses: actions/checkout@v4

      - name: Request (dispatch inputs, or requests/glue.env on a push)
        env:
          I_VOD_URL: ${{ inputs.vod_url }}
          I_CAMPAIGN: ${{ inputs.campaign }}
          I_MAX: ${{ inputs.max }}
          I_MODEL: ${{ inputs.model }}
          I_SEND: ${{ inputs.send }}
          I_SEND_TOP: ${{ inputs.send_top }}
          I_REAL: ${{ inputs.real }}
          I_GRADE: ${{ inputs.grade }}
          I_SPAN: ${{ inputs.span }}
          I_OPTIONS: ${{ inputs.options }}
        run: |
          get() {  # key=value from requests/glue.env (read as text, never run)
            grep -E "^$1=" requests/glue.env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '\r' | grep -E '^[A-Za-z0-9 :/._=-]*$' || true
          }
          for k in VOD_URL CAMPAIGN MAX MODEL SEND SEND_TOP REAL GRADE SPAN OPTIONS; do
            v=$(printenv "I_$k" || true)
            [ "${{ github.event_name }}" = push ] && v=$(get "$k")
            echo "R_$k=$v" >> "$GITHUB_ENV"
            declare "R_$k=$v"
          done
          {
            echo "R_MAX=${R_MAX:-10}"; echo "R_MODEL=${R_MODEL:-small.en}"; echo "R_SEND=${R_SEND:-no}"
            echo "R_SEND_TOP=${R_SEND_TOP:-0}"; echo "R_REAL=${R_REAL:-no}"; echo "R_GRADE=${R_GRADE:-no}"
            ref=main; community=no; release=; bar=0
            for o in $R_OPTIONS; do
              case "$o" in community) community=yes ;; lenient) echo "R_LENIENT=yes" ;; ref:*) ref=${o#ref:} ;; release:*) release=${o#release:} ;; bar:*) bar=${o#bar:} ;; format:*) echo "R_FORMAT=${o#format:}" ;; esac
            done
            # 25 Nov: every run is backed up to a private alfred-hq release, not just community runs
            [ -n "$release" ] || release="${R_CAMPAIGN:-test}-$(date -u +%F)"
            echo "R_REF=$ref"; echo "R_COMMUNITY=$community"; echo "R_RELEASE=$release"; echo "R_BAR=$bar"
          } >> "$GITHUB_ENV"
          [ -n "$R_VOD_URL" ] || { echo "No VOD URL"; exit 1; }

      - name: Glue (private alfred-hq, read only)
        uses: actions/checkout@v4
        with:
          repository: mapadda11/alfred-hq
          ref: ${{ env.R_REF }}
          token: ${{ secrets.ALFRED_HQ_TOKEN }}
          path: alfred-hq
          sparse-checkout: clips
          persist-credentials: false

      - name: Work folder
        run: |
          if sudo mkdir -p /mnt/work 2>/dev/null; then sudo chown "$USER" /mnt/work; W=/mnt/work; else W="$RUNNER_TEMP/work"; mkdir -p "$W"; fi
          mkdir -p "$W/tools/models" "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          echo "CLIP_TOOLS=$W/tools" >> "$GITHUB_ENV"
          echo "CLIPS_ROOT=$W/out" >> "$GITHUB_ENV"
          echo "CLIP_ENGINE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "GCLIP_MODELS=$W/tools/models" >> "$GITHUB_ENV"

      - name: Live progress in Telegram (one message, edited every 30 s)
        if: env.R_SEND == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: nohup python3 bin/progress.py "$WORK/out/run.log" "$WORK/progress.done" > "$WORK/progress.out" 2>&1 &

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-linux.txt

      - name: Tools (ffmpeg, yt-dlp, picture checks)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg cmake fonts-inter > /dev/null
          pip install -q -U "yt-dlp[default,curl-cffi]"
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r tools/requirements-linux.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Cache whisper.cpp
        id: wcache
        uses: actions/cache@v4
        with:
          path: ~/whisper-bin
          key: whisper-${{ env.WHISPER_TAG }}-x64-avx2-static

      - name: Build whisper.cpp (CPU)
        if: steps.wcache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp /tmp/wcpp
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON > /dev/null
          cmake --build /tmp/wcpp/build -j"$(nproc)" --target whisper-cli > /dev/null
          mkdir -p ~/whisper-bin && cp /tmp/wcpp/build/bin/whisper-cli ~/whisper-bin/

      - name: Whisper on PATH
        run: |
          echo "$HOME/whisper-bin" >> "$GITHUB_PATH"
          echo "WHISPER_BIN=$HOME/whisper-bin/whisper-cli" >> "$GITHUB_ENV"

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK }}/tools/models
          key: glue-speech-base.en-small.en

      - name: Cache picture models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            models
          key: vision-models-yunet2023mar-vitb32-laion2b

      - name: Models
        run: |
          for m in base.en small.en; do
            f="$CLIP_TOOLS/models/ggml-$m.bin"
            [ -s "$f" ] || curl -sSfL -o "$f" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$m.bin"
          done
          mkdir -p models && f=face_detection_yunet_2023mar.onnx
          [ -s "models/$f" ] || curl -sSfL -o "models/$f" "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/$f"
          cp -n "models/$f" "$CLIP_TOOLS/models/" || true

      - name: Engine (gaming-clip, pinned)
        run: |
          git clone -q https://github.com/iyansr/gaming-clip "$CLIP_TOOLS/gaming-clip"
          git -C "$CLIP_TOOLS/gaming-clip" checkout -q "$GC_COMMIT"
          for f in alfred-hq/clips/patches/gaming-clip-*.patch; do  # same fixes as the Mac's engine
            git -C "$CLIP_TOOLS/gaming-clip" apply "$GITHUB_WORKSPACE/$f" && echo "applied $(basename "$f")"
          done
          cd "$CLIP_TOOLS/gaming-clip" && bun install --frozen-lockfile > /dev/null

      - name: His gameplay for the F8 split (alfred-hq release "gameplay")
        continue-on-error: true  # none found: run_vod makes those clips F1 and the summary says so
        env:
          GH_TOKEN: ${{ secrets.ALFRED_HQ_TOKEN }}
        run: |
          fmt="$R_FORMAT"
          [ -n "$fmt" ] || fmt=$(grep -E '^format:' "alfred-hq/clips/campaigns/settings/${R_CAMPAIGN:-none}.txt" 2>/dev/null | head -1 | cut -d: -f2 | tr -d ' \r')
          [ "$fmt" = F8 ] || { echo "format ${fmt:-F1}: no gameplay needed"; exit 0; }
          mkdir -p "$WORK/gameplay" && echo "CLIP_GAMEPLAY_DIR=$WORK/gameplay" >> "$GITHUB_ENV"
          gh release download gameplay -R mapadda11/alfred-hq -p "*.mp4" -D "$WORK/gameplay"
          echo "$(ls "$WORK/gameplay" | wc -l) gameplay recording(s)"

      - name: Make clips
        id: make
        env:
          VOD_URL: ${{ env.R_VOD_URL }}
          MAX: ${{ env.R_MAX }}
          WHISPER_MODEL: ${{ env.R_MODEL }}
          CAMPAIGN: ${{ env.R_CAMPAIGN }}
          REAL: ${{ env.R_REAL }}
          SPAN: ${{ env.R_SPAN }}
          GRADE: ${{ env.R_GRADE }}
          COMMUNITY: ${{ env.R_COMMUNITY }}
          LENIENT: ${{ env.R_LENIENT }}
          FORMAT: ${{ env.R_FORMAT }}
        run: |
          set -o pipefail
          start=$(date +%s)
          mode="--test"
          [ "$REAL" = yes ] && [ -n "$CAMPAIGN" ] && mode="--no-push"  # real run: guard checks joined; log not pushed
          python -u alfred-hq/clips/bin/run_vod.py "$VOD_URL" $mode --max "$MAX" --prescan on ${CAMPAIGN:+--campaign "$CAMPAIGN"} ${SPAN:+--span "$SPAN"} $([ "$GRADE" = yes ] && echo --grade) $([ "$COMMUNITY" = yes ] && echo --community) $([ "$LENIENT" = yes ] && echo --lenient) ${FORMAT:+--format "$FORMAT"} > "$WORK/out/run.log" 2>&1 \
            && ok=1 || ok=0
          echo "minutes: $(( ($(date +%s) - start) / 60 ))" | tee -a "$WORK/out/run.log"
          tail -n 2 "$WORK/out/run.log"
          find "$WORK/out" -name "*.mp4" | wc -l
          [ "$ok" = 1 ]

      - name: Claude checks the top 5 and writes 3 hooks each (his C + light B, 25 Nov)
        if: always() && env.R_SEND == 'yes'
        continue-on-error: true  # the clips still go without it; the last Telegram message says it didn't run
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN in clip-engine: Claude check skipped"; exit 0; }
          top=$(find "$WORK/out" -name "*.mp4" | sort | while read -r f; do grep -q '"rejected": "[^"]' "${f%.mp4}.clip.json" 2>/dev/null || echo "$f"; done | head -5)
          [ -n "$top" ] || { echo "no clips to check"; exit 0; }
          npm install -g --silent @anthropic-ai/claude-code > /dev/null 2>&1
          # Output goes to a file, never this public log (alfred-hq CLAUDE.md: the run's words stay private)
          claude -p "$(cat alfred-hq/clips/bin/claude-check.md)

          OUT_FILE: $WORK/out/claude-check.json
          CLIPS:
          $top" --model claude-sonnet-5-5 --max-turns 40 --allowedTools "Read,Write" --add-dir "$WORK" --permission-mode acceptEdits > "$WORK/claude.out" 2>&1 || true
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d['clips']), 'clips checked')" "$WORK/out/claude-check.json" \
            || { rm -f "$WORK/out/claude-check.json"; echo "Claude check gave no usable answer"; exit 1; }

      - name: Back up clips and Viewer packs to a private alfred-hq release
        if: always()
        continue-on-error: true  # the clips still go to Telegram; the last message says the backup failed
        env:
          GH_TOKEN: ${{ secrets.ALFRED_HQ_TOKEN }}
          TAG: ${{ env.R_RELEASE }}
        run: |
          n=$(find "$WORK/out" -type f \( -name "*.mp4" -o -name "*.txt" -o -name "*.clip.json" -o -name "*.jpg" -o -name "*.json" -o -name "run.log" \) | wc -l)
          [ "$n" -gt 0 ] || { echo "BACKUP_NOTE=Backup: nothing to back up." >> "$GITHUB_ENV"; exit 0; }
          echo "BACKUP_NOTE=Backup FAILED (release $TAG): the clips are only in this Telegram chat. Tell Claude." >> "$GITHUB_ENV"
          gh release view "$TAG" -R mapadda11/alfred-hq > /dev/null 2>&1 || \
            gh release create "$TAG" -R mapadda11/alfred-hq --title "$TAG" --notes "Clips and Viewer packs. Private." > /dev/null
          mkdir -p "$WORK/up"
          find "$WORK/out" -type f \( -name "*.mp4" -o -name "*.txt" -o -name "*.clip.json" -o -name "*.jpg" -o -name "*.json" -o -name "run.log" \) | while read -r f; do
            cp "$f" "$WORK/up/r${GITHUB_RUN_ID}-$(basename "$f")"
          done
          gh release upload "$TAG" -R mapadda11/alfred-hq --clobber "$WORK"/up/*
          echo "BACKUP_NOTE=Backup: $(ls "$WORK/up" | wc -l) files on the private alfred-hq release $TAG." >> "$GITHUB_ENV"

      - name: Remember the moments used (alfred-hq clips/used.csv), so none is clipped twice
        if: always()
        continue-on-error: true
        env:
          ALFRED_HQ_TOKEN: ${{ secrets.ALFRED_HQ_TOKEN }}
        run: python3 alfred-hq/clips/bin/used.py add "$WORK/out" --ref "$R_REF" || echo "USED_NOTE=Used-moments list not saved this time (next run may repeat a moment)." >> "$GITHUB_ENV"

      - name: Finish the progress message
        if: always() && env.R_SEND == 'yes'
        run: touch "$WORK/progress.done" && sleep 32

      - name: Send to Telegram
        if: always() && env.R_SEND == 'yes'  # task 17: a run that breaks late still sends the clips it made
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TOP: ${{ env.R_SEND_TOP }}
          REAL: ${{ env.R_REAL }}
          MIN_SCORE: ${{ env.R_BAR }}
          BACKUP_NOTE: ${{ env.BACKUP_NOTE }} ${{ env.USED_NOTE }}
        run: |
          n=$(grep -aoE "Skipped [0-9]+ windows? the transcriber" "$WORK/out/run.log" | grep -oE "[0-9]+" | head -1)
          note="practice batch, not logged yet"
          [ "$REAL" = yes ] && note="ready to post"
          note="$note${n:+; $n chunk(s) skipped, could not transcribe}"
          python3 bin/send_clips.py "$WORK/out" "$note" "$SEND_TOP"

      - name: Tell him it failed
        # 25 Nov: cancelled() too, so a run that hits the time limit or is stopped never goes quiet
        if: (failure() || cancelled()) && env.R_SEND == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          MAKE: ${{ steps.make.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          why=$(grep -aE "Error|failed|FAILED|SystemExit|Refusing" "${WORK:-/none}/out/run.log" 2>/dev/null | grep -v onnxruntime | tail -n 1 | cut -c1-300)
          if [ "$STATUS" = cancelled ]; then head="The clip run was stopped (cancelled, or it hit the 5.5 h limit)."
          elif [ "$MAKE" = success ]; then head="The clips were made, but a step after them failed (sending or backup)."
          elif [ "$MAKE" = failure ]; then head="The clip run broke while making clips."
          else head="The clip run broke while setting up, before any clips."; fi
          python3 bin/send_telegram.py text "$head Nothing was posted, sir.
          Reason: ${why:-not in the clip log; see $RUN_URL}
          Any clips it made were sent above. Try again: send the same clip command."

      - uses: actions/upload-artifact@v4
        if: always() && env.R_REAL != 'yes'
        with:
          name: glue-out
          path: ${{ env.WORK }}/out
          retention-days: 1

      - uses: actions/upload-artifact@v4  # real clips never stay on this public repo (alfred-hq CLAUDE.md rule 11)
        if: always() && env.R_REAL == 'yes'
        with:
          name: glue-log
          path: ${{ env.WORK }}/out/run.log
          retention-days: 1
